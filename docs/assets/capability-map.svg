<path d="M1484 387H1501M1484 395H1501M1484 403H1494" fill="none" stroke="#a0c0ff" stroke-width="2" />
<text x="48" y="594" fill="#90aabe" font-size="18" font-weight="500" letter-spacing="1.4">DATA + RESEARCH + AI + TIME + EVIDENCE + KNOWLEDGE</text>
</g>
<path d="M24 628H1576" stroke="url(#accent)" stroke-width="3"/>
