<text x="1090" y="393" fill="#a0c0ff" font-size="21" font-weight="650" >06</text>
<text x="1090" y="435" fill="#e4eef7" font-size="23" font-weight="650" >REUSABLE KNOWLEDGE</text>
<text x="1090" y="477" fill="#a4bbcf" font-size="20" font-weight="400" >Curated workflows and negative findings</text>
<text x="1090" y="508" fill="#a4bbcf" font-size="20" font-weight="400" >Dated evidence and unresolved issues</text>
