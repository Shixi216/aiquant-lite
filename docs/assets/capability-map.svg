<rect x="48" y="357" width="484" height="184" rx="16" fill="#102331" stroke="#294254"/>
<text x="70" y="393" fill="#a0c0ff" font-size="21" font-weight="650" >04</text>
<text x="70" y="435" fill="#e4eef7" font-size="23" font-weight="650" >POINT-IN-TIME CONTRACTS</text>
<text x="70" y="477" fill="#a4bbcf" font-size="20" font-weight="400" >Explicit availability and decision cutoffs</text>
<text x="70" y="508" fill="#a4bbcf" font-size="20" font-weight="400" >Historical membership quality flags</text>
