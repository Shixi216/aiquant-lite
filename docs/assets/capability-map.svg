<text x="580" y="393" fill="#76dfcb" font-size="21" font-weight="650" >05</text>
<text x="580" y="435" fill="#e4eef7" font-size="23" font-weight="650" >TRACEABLE DECISIONS</text>
<text x="580" y="477" fill="#a4bbcf" font-size="20" font-weight="400" >Versioned packets and linked evidence</text>
<text x="580" y="508" fill="#a4bbcf" font-size="20" font-weight="400" >Risk constraints and audit records</text>
<path d="M983 377L1002 384V397Q998 411 983 416Q968 411 964 397V384ZM973 394L981 402L994 388" fill="none" stroke="#76dfcb" stroke-width="2" />
