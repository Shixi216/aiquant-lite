[project]
name = "hermes-opc"
version = "0.1.0"
description = "A-share research multi-agent workspace powered by Hermes"
requires-python = ">=3.11,<3.12"
dependencies = [
    "akshare>=1.18.64",
    "baostock>=0.9.3",
    "duckdb>=1.5.4",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "mcp>=1.27,<2",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "pytz>=2026.2",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
    "tushare>=1.4.29",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
aiquant-lite-mcp = "mcp_servers.finance_data.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
